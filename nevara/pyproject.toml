[project]
name = "nevara"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "watchdog>=6.0.0",
]

[project.scripts]
nevara = "nevara:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
